="12" fill="#536780" font-weight="400">Voltage</text><text x="1345.0" y="538" font-size="12" fill="#536780" font-weight="400">Current</text><text x="1192" y="567" font-size="24" fill="#092443" font-weight="600">13.4 V</text><text x="1345.0" y="567" font-size="24" fill="#092443" font-weight="600">+4.2 A</text><rect x="1192" y="585" width="306" height="1" rx="0" fill="#e3edf5" stroke="none"/><text x="1192" y="612" font-size="14" fill="#536780" font-weight="400">Starter</text><text x="1401" y="612" font-size="21" fill="#092443" font-weight="600">12.7 V</text><text x="1192" y="633" font-size="11" fill="#637c95" font-weight="400">Voltage only · charge unavailable</text><rect x="1192" y="647" width="306" height="1" rx="0" fill="#e3edf5" stroke="none"/><text x="1192" y="671" font-size="13" fill="#16887f" font-weight="600">View electrical →</text><rect x="1170" y="700" width="350" height="144" rx="16" fill="white" stroke="#dfe9f1"/><text x="1190" y="734" font-size="21" fill="#092443" font-weight="700">Engine</text><text x="1484" y="734" font-size="21" fill="#16887f" font-weight="400">→</text><text x="1190" y="766" font-size="16" fill="#536780" font-weight="400">Not connected</text><text x="1190" y="792" font-size="12" fill="#637c95" font-weight="400">Engine monitoring is coming next.</text><text x="1190" y="821" font-size="10" fill="#16887f" font-weight="600">COMING SOON</text><rect x="1170" y="860" width="350" height="144" rx="16" fill="white" stroke="#dfe9f1"/><text x="1190" y="894" font-size="21" fill="#092443" font-weight="700">Routes</text><text x="1484" y="894" font-size="21" fill="#16887f" font-weight="400">→</text><text x="1190" y="926" font-size="16" fill="#536780" font-weight="400">No tracking active</text><text x="1190" y="952" font-size="12" fill="#637c95" font-weight="400">Trip recording is coming next.</text><text x="1190" y="981" font-size="10" fill="#16887f" font-weight="600">COMING SOON</text><text x="1170" y="1034" font-size="12" fill="#637c95" font-weight="400">Concept preview · sample readings</text><text x="45" y="850" font-size="12" fill="#16887f" font-weight="700">WHAT CHANGES</text><text x="45" y="889" font-size="26" fill="#092443" font-weight="700">Electrical becomes a useful summary.</text><text x="45" y="923" font-size="17" fill="#536780" font-weight="400">House charge, signed current and both voltages stay visible on Home.</text><text x="45" y="953" font-size="17" fill="#536780" font-weight="400">Tap through to /elec for the full battery view.</text><text x="45" y="1003" font-size="16" fill="#536780" font-weight="400">Unavailable / stale readings show — with a waiting status.</text><text x="45" y="1033" font-size="16" fill="#536780" font-weight="400">Starter charge stays unavailable. No invented Engine or Routes values.</text></svg>