<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1110" viewBox="0 0 1580 1110" role="img" aria-labelledby="title desc"><title id="title">aiNavLog home dashboard concept</title><desc id="desc">Desktop and phone mockups bring house and starter readings into the Electrical home card. Engine and Routes remain explicitly unavailable. All electrical values are illustrative samples.</desc><style>text{font-family:Inter,Arial,sans-serif}</style><rect x="0" y="0" width="1580" height="1110" rx="0" fill="#e4ecf3" stroke="none"/><text x="35" y="42" font-size="16" fill="#536780" font-weight="600">HOME / INFORMATION AT A GLANCE</text><text x="35" y="82" font-size="32" fill="#092443" font-weight="700">Your systems, brought to the home screen.</text><text x="35" y="110" font-size="15" fill="#536780" font-weight="400">UI mockup · illustrative sample readings · existing navy / teal palette</text><rect x="30" y="145" width="1070" height="650" rx="18" fill="#f0f6fb" stroke="none"/><rect x="30" y="145" width="1070" height="76" rx="0" fill="#153b5e" stroke="none"/><text x="56" y="193" font-size="27" fill="white" font-weight="700">◈  aiNavLog</text><text x="1000" y="190" font-size="15" fill="white" font-weight="400">My boat</text><text x="62" y="275" font-size="33" fill="#092443" font-weight="700">Your boat at a glance</text><text x="62" y="304" font-size="16" fill="#536780" font-weight="400">Key readings here. Open a card for the full picture.</text><rect x="62" y="336" width="320" height="350" rx="16" fill="white" stroke="#dfe9f1"/><rect x="82" y="356" width="36" height="36" rx="10" fill="#def5f5" stroke="none"/><text x="91" y="381" font-size="24" fill="#16887f" font-weight="600">ϟ</text><text x="130" y="381" font-size="23" fill="#092443" font-weight="700">Electrical</text><rect x="265" y="362" width="98" height="25" rx="12" fill="#e4f4f1" stroke="none"/><text x="275" y="379" font-size="11" fill="#146f67" font-weight="600">SAMPLE DATA</text><text x="84" y="430" font-size="11"