<text x="40" y="1452" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#0f172a">Writes: Device Interface → injected ObservationSink → Data capture → Local data store. Reads: UI → native query APIs → Local data store.</text>
<text x="40" y="1485" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Device Interface never opens or queries SQLite. Capture and storage have no dependency on Bluetooth or vendor-specific Rust types.</text>
<rect x="40" y="1510" width="1880" height="96" rx="8" fill="#eff6ff" stroke="#64748b"/>
<text x="58" y="1539" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">Logical ownership and physical packages are explicit; all mobile components are bundled within the same app.</text>
<text x="58" y="1566" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#0f172a">Native integration assembles the pipeline. Shared contracts define the sink. Storage queries remain available after disconnect.</text>
<text x="58" y="1591" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#0f172a">The refactor preserves database filenames, schema version, rows, receipt timestamps and C ABI names; no user data is deleted or migrated.</text>
<text x="40" y="1640" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#0f172a">Future work: maintenance CRUD, broader capture workflows, retention/export/protection and real-device qualification. See ADR-0001 / ADR-0002.</text>
<text x="40" y="1675" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#0f172a">iPhone 1.0.0 (7): ready in TestFlight. Physical-phone history/reception regression remains pending. Android replacement is deferred.</text>
<text x="40" y="1705" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#0f172a">Classes, functions and contracts are grouped by responsibility. Source references: docs/device-interface-implementation-view.md</text>
