ansform="translate(899,160) rotate(-35)" class="small">Jan 18</text><path d="M965 150V552" stroke="#e0e7ef"/><text transform="translate(969,160) rotate(-35)" class="small">Jan 25</text><rect x="15" y="180" width="1035" height="62" fill="#f5f8fb"/><text x="25" y="213" class="label">Electrical / mobile stabilization</text><rect x="335" y="197" width="120" height="27" rx="5" fill="#285d99"/><text x="342" y="216" style="font:12px Arial;fill:white">Nov 23–Dec 04</text><path d="M450.0 203l7 7-7 7-7-7Z" fill="white" stroke="#193149"><title>Review 2026-12-04</title></path><text x="25" y="275" class="label">Engine</text><rect x="475" y="259" width="120" height="27" rx="5" fill="#285d99"/><text x="482" y="278" style="font:12px Arial;fill:white">Dec 07–Dec 18</text><path d="M590.0 265l7 7-7 7-7-7Z" fill="white" stroke="#193149"><title>Review 2026-12-18</title></path><rect x="15" y="304" width="1035" height="62" fill="#f5f8fb"/><text x="25" y="337" class="label">Route</text><rect x="615" y="321" width="120" height="27" rx="5" fill="#285d99"/><text x="622" y="340" style="font:12px Arial;fill:white">Dec 21–Jan 01</text><path d="M720.0 327l7 7-7 7-7-7Z" fill="white" stroke="#193149"><title>Review 2026-12-31</title></path><text x="25" y="399" class="label">Authentication / authorization</text><rect x="755" y="383" width="120" height="27" rx="5" fill="#285d99"/><text x="762" y="402" style="font:12px Arial;fill:white">Jan 04–Jan 15</text><path d="M870.0 389l7 7-7 7-7-7Z" fill="white" stroke="#193149"><title>Review 2027-01-15</title></path><rect x="15" y="428" width="1035" height="62" fill="#f5f8fb"/><text x="25" y="461" class="label">Route story</text><rect x="895" y="445" width="120" height="27" rx="5" fill="#285d99"/><text x="902" y="464" style="font:12px Arial;fill:white">Jan 18–Jan 29</text><path d="M1010.0 451l7 7-7 7-7-7Z" fill="white" stroke="#193149"><title>Review 2027-01-29</title></path><text x="25" y="523" class="label">Distribution / CI follow-up</text><rect x="335" y="50