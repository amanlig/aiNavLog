name: ainavlog-diagram
services:
  diagram-api:
    image: ${DIAGRAM_IMAGE:?Set a versioned DIAGRAM_IMAGE}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 100s
    environment:
      HOST: 0.0.0.0
      PORT: "8788"
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      DIAGRAM_SCAN_TOKEN_FILE: /run/secrets/diagram_scan_token
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1}
      DIAGRAM_ALLOWED_ORIGINS: ${DIAGRAM_ALLOWED_ORIGINS:-}
    secrets: [openai_api_key, diagram_scan_token]
    # No host ports: only the existing HTTPS proxy reaches this container.
    networks:
      proxy:
        aliases: [ainavlog-diagram-api]
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "3"
secrets:
  openai_api_key:
    file: ./.secrets/openai_api_key
  diagram_scan_token:
    file: ./.secrets/diagram_scan_token
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set the existing Caddy Docker network name}
