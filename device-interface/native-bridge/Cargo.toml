[package]
name = "ainavlog-native-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
mobile = ["ainavlog-device-interface/ble", "dep:btleplug", "dep:tokio"]

[dependencies]
ainavlog-device-interface = { path = "..", default-features = false }
btleplug = { version = "0.13.3", optional = true }
tokio = { version = "1.53.1", optional = true, features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
